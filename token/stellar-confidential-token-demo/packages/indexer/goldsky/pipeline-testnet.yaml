name: confidential-token-testnet
apiVersion: 3
sources:
  stellar_testnet_events:
    type: dataset
    dataset_name: stellar_testnet.events
    version: 1.2.0
    start_at: 3013364
transforms:
  token_events:
    type: sql
    sql: |
      SELECT
        id,
        contract_id,
        ledger_sequence AS ledger,
        ledger_closed_at,
        transaction_hash AS tx_hash,
        transaction_index,
        CAST(NULL AS INT) AS operation_index,
        topics AS topic,
        data AS `value`
      FROM stellar_testnet_events
      WHERE transaction_successful = TRUE
        AND in_successful_contract_call = TRUE
        -- Match the confidential-token event *family* by shape, NOT by a
        -- hardcoded contract id. Every instance is indexed automatically: the
        -- demo's own deploy AND any contract a user deploys in "advanced mode",
        -- with no per-deployment registration and no DB write. The Worker still
        -- scopes reads to a single contract_id, so any unrelated contract that
        -- slips through this filter is dropped on read.
        AND (
          -- register: confidential shape is [register, account] carrying an
          -- `auditor_id` field.
          (
            JSON_VALUE(topics, '$[0].symbol') = 'register'
            AND JSON_VALUE(topics, '$[1].address') IS NOT NULL
            AND JSON_VALUE(topics, '$[2].address') IS NULL
            AND data LIKE '%auditor%'
          )
          OR (
            -- transfer/withdraw collide with the SAC / SEP-41 firehose (which is
            -- ALSO Map-format: data = {amount, to_muxed_id}). Identify the
            -- confidential family POSITIVELY by a ciphertext field every
            -- confidential transfer and withdraw carries — `sigma`. It cannot
            -- occur in a SAC/SEP-41 event, nor inside hex bytes / i128 / base32
            -- addresses, so this is a clean substring test.
            JSON_VALUE(topics, '$[0].symbol') IN ('transfer', 'withdraw')
            AND data LIKE '%sigma%'
          )
          OR (
            -- deposit: confidential shape is [deposit, from, to] (a second
            -- address topic) carrying an `amount` field. Excludes foreign
            -- `deposit` events with a different arity or fields (vault deposits,
            -- single-arg deposits, multi-field budgeting apps seen on testnet).
            JSON_VALUE(topics, '$[0].symbol') = 'deposit'
            AND JSON_VALUE(topics, '$[2].address') IS NOT NULL
            AND data LIKE '%amount%'
          )
          OR (
            -- merge: confidential shape is exactly [merge, account] with NO data
            -- fields. An empty event Map serializes with no "symbol" key text,
            -- so `data NOT LIKE '%symbol%'` asserts "carries no fields".
            JSON_VALUE(topics, '$[0].symbol') = 'merge'
            AND JSON_VALUE(topics, '$[1].address') IS NOT NULL
            AND JSON_VALUE(topics, '$[2].address') IS NULL
            AND data NOT LIKE '%symbol%'
          )
          OR (
            -- compliance + policy membership events: the compliant token emits
            -- frozen/unfrozen; the allowlist/blocklist policy contracts emit
            -- user_*. All share the [symbol, account] / empty-Map shape as
            -- `merge`. The symbol is the snake_case of the soroban
            -- #[contractevent] struct name, so the allowlist's `UserAllowed`
            -- struct emits `user_allowed` (NOT `allow`, despite the library
            -- docstrings). The Worker scopes reads to one contract_id, so a
            -- foreign [symbol, account] event reusing one of these names is
            -- dropped on read.
            JSON_VALUE(topics, '$[0].symbol') IN (
              'frozen', 'unfrozen',
              'user_allowed', 'user_disallowed',
              'user_blocked', 'user_unblocked'
            )
            AND JSON_VALUE(topics, '$[1].address') IS NOT NULL
            AND JSON_VALUE(topics, '$[2].address') IS NULL
            AND data NOT LIKE '%symbol%'
          )
          -- stellar-confidential v0.8.0 additions. The SDK replays every one of
          -- these into wallet state, so a missing row breaks recovery once the
          -- event ages out of the RPC window — even for operations the app
          -- never initiates (anyone can call set_spender on the token).
          OR (
            -- set_spender: [set_spender, account, spender].
            JSON_VALUE(topics, '$[0].symbol') = 'set_spender'
            AND JSON_VALUE(topics, '$[2].address') IS NOT NULL
            AND data LIKE '%live_until_ledger%'
          )
          OR (
            -- spender_transfer: [spender_transfer, spender, from, to].
            JSON_VALUE(topics, '$[0].symbol') = 'spender_transfer'
            AND JSON_VALUE(topics, '$[3].address') IS NOT NULL
            AND data LIKE '%sigma_a_new%'
          )
          OR (
            -- revoke_spender: [revoke_spender, account, spender].
            JSON_VALUE(topics, '$[0].symbol') = 'revoke_spender'
            AND JSON_VALUE(topics, '$[2].address') IS NOT NULL
            AND data LIKE '%allowance_salt%'
          )
          OR (
            -- clawback: [clawback, account] with an `amount` field
            -- (`destination` is omitted from the map when None). The SAC's own
            -- clawback is [clawback, from, asset] with a bare i128 as data, so
            -- it carries no `amount` key.
            JSON_VALUE(topics, '$[0].symbol') = 'clawback'
            AND JSON_VALUE(topics, '$[1].address') IS NOT NULL
            AND JSON_VALUE(topics, '$[2].address') IS NULL
            AND data LIKE '%amount%'
          )
          OR (
            -- compliance_config_changed: [compliance_config_changed], no
            -- account topic (`policy` is omitted from the map when None).
            JSON_VALUE(topics, '$[0].symbol') = 'compliance_config_changed'
            AND JSON_VALUE(topics, '$[1].address') IS NULL
            AND data LIKE '%sac_passthrough%'
          )
          -- The pre-v0.8.0 predicates were verified against live rows; the
          -- v0.8.0 branches follow the contract's #[contractevent] definitions.
          -- All are pinned by packages/indexer/test/shape-filter.mjs.
        )
    primary_key: id
sinks:
  raw_events:
    type: postgres
    from: token_events
    table: raw_events
    schema: public
    secret_name: INDEXER_POSTGRES_CREDENTIALS
    primary_key: id
